<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Open card in Cowork</title>
<style>
  :root{--paper:#FBFAF7;--panel:#fff;--ink:#1B1A17;--muted:#6E6A60;--line:#E4E0D8;--accent:#B4530A;--accent-ink:#fff;--code:#F2EFE8}
  @media (prefers-color-scheme:dark){:root{--paper:#141311;--panel:#1C1B18;--ink:#EDEAE3;--muted:#99938A;--line:#2E2B26;--accent:#E8873A;--accent-ink:#18150F;--code:#232019}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;padding:44px 16px 56px}
  .wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
  .eyebrow{margin:0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
  h1{margin:6px 0 0;font-size:clamp(23px,6vw,30px);line-height:1.15;text-wrap:balance}
  p{margin:0;color:var(--muted);font-size:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:13px}
  .id{font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--code);border-radius:6px;padding:9px 11px;word-break:break-all;color:var(--ink)}
  a.btn{display:block;text-align:center;text-decoration:none;border-radius:8px;padding:13px 16px;font-weight:600;font-size:15px;border:1px solid var(--accent)}
  a.primary{background:var(--accent);color:var(--accent-ink)}
  a.ghost{background:transparent;color:var(--accent)}
  .row{display:flex;flex-direction:column;gap:9px}
  pre{margin:8px 0 0;background:var(--code);border-radius:6px;padding:11px;overflow-x:auto;font:12px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap}
  details{border-top:1px solid var(--line);padding-top:13px}
  summary{cursor:pointer;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header><p class="eyebrow">Daily Scrum Board</p><h1 id="head">Opening in Cowork</h1></header>
  <div class="card" id="panel">
    <div><p style="margin-bottom:6px">Card</p><div class="id" id="cid">&mdash;</div></div>
    <div class="row">
      <a class="btn primary" id="cowork" href="#">Open in Cowork</a>
      <a class="btn ghost" id="code" href="#">Open in Claude Code</a>
    </div>
    <p id="status">Handing over to the desktop app&hellip;</p>
  </div>
  <details>
    <summary>Nothing opened? Paste this instead</summary>
    <pre id="raw">&mdash;</pre>
    <p style="margin-top:9px">Or use the web: <a id="web" href="#">claude.ai</a></p>
  </details>
</div>
<script>
(function(){
  var g=function(k){return document.getElementById(k)};
  var id=(new URLSearchParams(location.search).get('c')||location.hash.replace(/^#/,'')||'').replace(/-/g,'').trim();
  var TAIL=' in the Tasks database. Refresh its Thread rows from the live source first, then tell me in three lines where it stands, what you would send, one alternative, and only what you need from me. Do not send anything until I say send.';
  if(!id){ g('head').textContent='No card in the link'; g('panel').style.display='none'; return; }
  var prompt='Use the work-card skill on Notion card '+id+TAIL;
  var q=encodeURIComponent(prompt);
  var cw='claude://cowork/new?q='+q;
  g('cid').textContent=id;
  g('cowork').href=cw;
  g('code').href='claude://code/new?q='+q;
  g('web').href='https://claude.ai/new?q='+q;
  g('raw').textContent=prompt;
  setTimeout(function(){
    window.location.href=cw;
    setTimeout(function(){ g('status').textContent='If Cowork did not come to the front, press the button above.'; },1200);
  },200);
})();
</script>
</body>
</html>
